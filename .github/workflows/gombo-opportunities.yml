name: Gombo Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Build static opportunities site
        run: python scripts/build_static_site.py

      - name: Commit updated opportunities
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Gombo Opportunities feed"
          file_pattern: "index.html assets data"
